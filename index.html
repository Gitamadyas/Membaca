<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Belajar Membaca Anak</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background-color: #e0f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      width: 90%;
      max-width: 500px;
    }
    .level-badge {
      font-size: 1.3rem;
      color: #ff6f61;
      font-weight: bold;
    }
    .mode-title {
      font-size: 1rem;
      color: #00838f;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .word-display {
      font-size: 2.5rem;
      font-weight: bold;
      color: #2c3e50;
      margin: 20px 0;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px dashed #b2ebf2;
      border-radius: 15px;
      background-color: #fafafa;
      padding: 15px;
      word-break: break-word;
      line-height: 1.3;
    }
    .btn {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin: 5px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: 0.2s;
    }
    .btn-audio { background-color: #ffca28; color: #333; }
    .btn-mic { background-color: #42a5f5; color: #fff; }
    .btn-mode { background-color: #ab47bc; color: #fff; width: 100%; margin-top: 15px; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
    .status-text {
      margin-top: 15px;
      font-weight: bold;
      min-height: 24px;
      font-size: 0.95rem;
    }
    .success { color: #2e7d32; }
    .error { color: #c62828; }
  </style>
</head>
<body>

<div class="card">
  <div id="levelBadge" class="level-badge">Level 1</div>
  <div id="modeTitle" class="mode-title">Mode Mencoba</div>
  
  <div id="wordDisplay" class="word-display">Memuat...</div>

  <div id="actionArea">
    <button id="btnAudio" class="btn btn-audio" onclick="putarAudioContoh()">🔊 Dengar Contoh</button>
    <button id="btnMic" class="btn btn-mic" onclick="mulaiMerekam()">🎙️ Mulai Baca</button>
  </div>

  <div id="statusText" class="status-text"></div>
  
  <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
  <button id="btnModeUjian" class="btn btn-mode" onclick="pindahKeUjian()" disabled>🔒 Mode Ujian (Terkunci)</button>
</div>

<script>
  // API URL Web App Google Apps Script Kamu yang Baru
  const API_URL = "https://script.google.com/macros/s/AKfycbz8WB0yTgZ1-vAO2hjVIAmBotDQ7tZ36TX63IRc-xcaRvkC4x5cXajHHfGs7mjwSCSB1g/exec";
  
  let currentLevel = 1;
  let currentMode = "mencoba";
  let soalList = [];
  let currentIndex = 0;
  
  // Inisialisasi Pendeteksi Suara (Web Speech API)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'id-ID';
    recognition.continuous = false;
    
    recognition.onresult = function(event) {
      const hasilSuara = event.results[0][0].transcript;
      evaluasiJawaban(hasilSuara);
    };

    recognition.onerror = function() {
      tampilkanStatus("Suara tidak terdengar, coba klik 'Mulai Baca' lagi ya!", false);
    };
  } else {
    alert("Gunakan Google Chrome di komputer/HP untuk dukungan deteksi suara!");
  }

  // Mengambil Data Soal dari Google Sheets
  async function muatSoal(level, mode) {
    document.getElementById("wordDisplay").innerText = "Memuat...";
    document.getElementById("statusText").innerText = "";
    
    try {
      const response = await fetch(`${API_URL}?level=${level}&mode=${mode}`, {
        method: "GET",
        redirect: "follow"
      });
      
      soalList = await response.json();
      
      if (!soalList || soalList.length === 0 || soalList.error) {
        document.getElementById("wordDisplay").innerText = "Kosong";
        tampilkanStatus(`Soal untuk Level ${level} belum ada di BankSoal!`, false);
        return;
      }
      
      currentIndex = 0;
      tampilkanSoal();
    } catch (error) {
      console.error(error);
      document.getElementById("wordDisplay").innerText = "Gagal";
      tampilkanStatus("Gagal terhubung ke Google Sheets. Cek koneksi atau deployment.", false);
    }
  }

  function tampilkanSoal() {
    if (soalList.length === 0) return;
    
    const target = soalList[currentIndex];
    document.getElementById("wordDisplay").innerText = target.teks;
    document.getElementById("levelBadge").innerText = `Level ${target.level}`;
    
    if (currentMode === "mencoba") {
      document.getElementById("btnAudio").style.display = "inline-block";
      document.getElementById("modeTitle").innerText = "Mode Mencoba (Latihan Bebas)";
    } else {
      document.getElementById("btnAudio").style.display = "none";
      document.getElementById("modeTitle").innerText = "Mode Ujian (Tes Ketuntasan 100%)";
    }
  }

  // Logika Pemutaran Audio (Otomatis: Link MP3 atau Text-to-Speech)
  function putarAudioContoh() {
    const audioUrl = soalList[currentIndex].audioContoh;
    
    // Jika ada link audio MP3 yang valid di kolom C
    if (audioUrl && audioUrl.startsWith("http")) {
      const audio = new Audio(audioUrl);
      audio.play().catch(() => fallbackTextToSpeech());
    } else {
      // Jika kolom C kosong, gunakan suara bawaan browser (Text-to-Speech)
      fallbackTextToSpeech();
    }
  }

  function fallbackTextToSpeech() {
    // Hapus tanda hubung pemenggalan kata (misal: "ba-ju" menjadi "baju") agar lafal lancar
    const teksBersih = soalList[currentIndex].teks.replace(/-/g, "");
    const utterance = new SpeechSynthesisUtterance(teksBersih);
    utterance.lang = 'id-ID';
    utterance.rate = 0.8; // Kecepatan agak lambat agar jelas untuk anak
    window.speechSynthesis.speak(utterance);
  }

  function mulaiMerekam() {
    if (!recognition) return;
    tampilkanStatus("Mendengarkan... Silakan baca sekarang!", true);
    recognition.start();
  }

  function evaluasiJawaban(jawabanSuara) {
    // Bersihkan karakter selain huruf dan angka untuk toleransi artikulasi anak
    const teksTarget = soalList[currentIndex].teks.toLowerCase().replace(/[^a-z0-9]/g, "").trim();
    const jawabanBersih = jawabanSuara.toLowerCase().replace(/[^a-z0-9]/g, "").trim();

    if (jawabanBersih === teksTarget) {
      tampilkanStatus(`Hebat! Pelafalan: "${jawabanSuara}" (Benar)`, true);
      
      setTimeout(() => {
        currentIndex++;
        if (currentIndex < soalList.length) {
          tampilkanSoal();
          document.getElementById("statusText").innerText = "";
        } else {
          selesaiSatuMode();
        }
      }, 1200);

    } else {
      if (currentMode === "mencoba") {
        tampilkanStatus(`Terdengar: "${jawabanSuara}". Coba dengarkan contohnya lagi!`, false);
        putarAudioContoh();
      } else {
        // Mode Ujian: Gugur 1 soal = Reset ke nomor 1 dengan urutan diacak lagi
        putarSuaraSistem("Maaf, belum tuntas. Kembali ke awal level!");
        alert("Ada yang belum tepat! Ujian diulang dari nomor 1 dengan urutan soal diacak kembali.");
        muatSoal(currentLevel, "ujian");
      }
    }
  }

  function selesaiSatuMode() {
    if (currentMode === "mencoba") {
      putarSuaraSistem("Luar biasa! Latihan selesai. Mode Ujian terbuka!");
      tampilkanStatus("Latihan Selesai! Klik tombol Mode Ujian di bawah.", true);
      document.getElementById("btnModeUjian").disabled = false;
      document.getElementById("btnModeUjian").innerText = "▶️ Mulai Mode Ujian";
    } else {
      putarSuaraSistem("Selamat, kamu tuntas!");
      alert(`SELAMAT! Kamu TUNTAS Level ${currentLevel}!`);
      
      if (currentLevel < 8) {
        currentLevel++;
        currentMode = "mencoba";
        document.getElementById("btnModeUjian").disabled = true;
        document.getElementById("btnModeUjian").innerText = "🔒 Mode Ujian (Terkunci)";
        muatSoal(currentLevel, "mencoba");
      } else {
        alert("SELAMAT BERMAIN! Kamu telah menuntaskan seluruh 8 Level Game Membaca!");
      }
    }
  }

  function pindahKeUjian() {
    currentMode = "ujian";
    muatSoal(currentLevel, "ujian");
  }

  function tampilkanStatus(pesan, isSuccess) {
    const el = document.getElementById("statusText");
    el.innerText = pesan;
    el.className = "status-text " + (isSuccess ? "success" : "error");
  }

  function putarSuaraSistem(teks) {
    const utterance = new SpeechSynthesisUtterance(teks);
    utterance.lang = 'id-ID';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }

  window.onload = function() {
    muatSoal(currentLevel, "mencoba");
  };
</script>

</body>
</html>
