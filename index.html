<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Petualangan Membaca 📚</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e0f7fa;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            max-width: 500px;
            width: 90%;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 4px solid #4fc3f7;
        }
        .level-badge {
            font-size: 18px;
            background: #ffb74d;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            display: inline-block;
            font-weight: bold;
        }
        .mode-title {
            font-size: 1rem;
            color: #00838f;
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .target-text {
            font-size: 2.8rem;
            font-weight: bold;
            color: #0288d1;
            margin: 15px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #b2ebf2;
            border-radius: 15px;
            background-color: #fafafa;
            padding: 12px;
            word-break: break-word;
            transition: all 0.3s ease;
        }
        .btn {
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .btn-audio { background-color: #ffca28; color: #333; }
        .btn-mic { background-color: #42a5f5; color: #fff; }
        .btn-stop { background-color: #ef5350; color: #fff; display: none; }
        .btn-skip { background-color: #ff9800; color: #fff; width: 100%; margin-top: 10px; font-size: 1rem; }
        .btn-play-user { background-color: #66bb6a; color: #fff; display: none; }
        .btn-mode { background-color: #ab47bc; color: #fff; width: 100%; margin-top: 10px; }
        .btn-back { background-color: #78909c; color: #fff; width: 100%; margin-top: 15px; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
        
        input[type="text"] {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #b2ebf2;
            border-radius: 10px;
            width: 80%;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        
        .level-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .level-card {
            background: #e1f5fe;
            border: 2px solid #81d4fa;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .level-card.locked {
            background: #eee;
            border-color: #ccc;
            color: #888;
            cursor: not-allowed;
        }

        .status-text {
            margin-top: 10px;
            font-weight: bold;
            min-height: 24px;
            font-size: 1.1rem;
        }
        .detected-text {
            font-size: 0.9rem;
            color: #333;
            margin-top: 5px;
            font-style: italic;
            background: #e8f5e9;
            padding: 6px;
            border-radius: 8px;
            display: none;
        }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
        .correct-anim {
            background-color: #c8e6c9 !important;
            border-color: #2e7d32 !important;
            transform: scale(1.05);
        }
        .listening-anim {
            border-color: #42a5f5 !important;
            background-color: #e3f2fd !important;
        }
    </style>
</head>
<body>

<div class="game-container">
  <!-- TAMPILAN 1: FORM INPUT NAMA -->
  <div id="startScreen">
    <h2 style="color: #00838f;">Selamat Datang! 👋</h2>
    <p>Masukkan nama kamu untuk mulai petualangan membaca:</p>
    <input type="text" id="inputNama" placeholder="Nama Kamu..." />
    <br>
    <button class="btn btn-mic" onclick="mulaiPermainan()">🎮 Mulai Main</button>
  </div>

  <!-- TAMPILAN 2: PETA PILIHAN LEVEL 1-8 -->
  <div id="levelMapScreen" style="display: none;">
    <h3 id="playerGreeting" style="color: #00838f; margin: 0;"></h3>
    <p style="font-size: 0.9rem; color: #666;">Pilih Level Membaca Kamu:</p>
    
    <div class="level-grid" id="levelGrid">
      <!-- Level 1-8 digenerate otomatis -->
    </div>
  </div>

  <!-- TAMPILAN 3: AREA GAMEPLAY -->
  <div id="gameScreen" style="display: none;">
    <div id="levelBadge" class="level-badge">Level 1</div>
    <div id="modeTitle" class="mode-title">Mode Mencoba</div>
    
    <div id="wordDisplay" class="target-text">Memuat...</div>

    <div id="actionArea">
      <button id="btnAudio" class="btn btn-audio" onclick="putarAudioContoh()">🔊 Contoh</button>
      <button id="btnMic" class="btn btn-mic" onclick="mulaiMerekam()">🎙️ Mulai Baca</button>
      <button id="btnStop" class="btn btn-stop" onclick="hentikanMerekamManual()">🛑 Berhenti</button>
      <button id="btnPlayUser" class="btn btn-play-user" onclick="putarRekamanUser()">🎧 Suara Saya</button>
    </div>

    <div id="statusText" class="status-text"></div>
    <div id="detectedText" class="detected-text"></div>

    <div>
      <button id="btnSkip" class="btn btn-skip" onclick="lewatiSoalTanpaValidasi()">➡️ Lanjut Ke Soal Berikutnya</button>
    </div>

    <button id="btnModeUjian" class="btn btn-mode" onclick="pindahKeUjian()">▶️ Mulai Mode Ujian</button>
    <button class="btn btn-back" onclick="kembaliKePetaLevel()">⬅️ Kembali Pilih Level</button>
  </div>
</div>

<script>
  // URL GOOGLE APPS SCRIPT
  const API_URL = "https://script.google.com/macros/s/AKfycbw8DKVxjeZBtc59r184OU7X6hwWM1x4kLD3DswPeEXCfVcHsEngtxSt0Phi33zOeTZw/exec";
  
  let namaSiswa = "";
  let currentLevel = 1;
  let maxUnlockedLevel = 2; // Level 1 dan 2 Terbuka secara Default
  let currentMode = "mencoba";
  let soalList = [];
  let currentIndex = 0;
  
  let mediaRecorder;
  let audioChunks = [];
  let userAudioUrl = null;
  let isEvaluated = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'id-ID';
    recognition.continuous = true;
    recognition.interimResults = true;
    
    recognition.onresult = function(event) {
      let hasilSuara = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        hasilSuara += event.results[i][0].transcript;
      }
      
      if (hasilSuara.trim() !== "") {
        const teksMasuk = hasilSuara.trim();
        document.getElementById("detectedText").style.display = "block";
        document.getElementById("detectedText").innerText = `Terdengar: "${teksMasuk}"`;
        
        // HANYA VALIDASI OTOMATIS JIKA SOAL DI LEVEL 3 KE ATAS
        if (currentLevel >= 3) {
          evaluasiJawabanOtomatis(teksMasuk);
        } else {
          tampilkanStatus("ℹ️ Suara terekam. Klik 'Lanjut Ke Soal Berikutnya' jika sudah selesai.", true);
        }
      }
    };

    recognition.onerror = function() {
      if (!isEvaluated) {
        hentikanMerekamManual();
        tampilkanStatus("❌ Suara tidak terdeteksi. Coba 'Mulai Baca' lagi!", false);
      }
    };

    recognition.onend = function() {
      stopAudioRecording();
    };
  }

  function mulaiPermainan() {
    const input = document.getElementById("inputNama").value.trim();
    if (input === "") {
      alert("Silakan masukkan nama kamu terlebih dahulu!");
      return;
    }
    namaSiswa = input;
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("levelMapScreen").style.display = "block";
    document.getElementById("playerGreeting").innerText = `Halo, ${namaSiswa}! 😊`;
    
    renderPetaLevel();
  }

  function renderPetaLevel() {
    const grid = document.getElementById("levelGrid");
    grid.innerHTML = "";
    
    for (let i = 1; i <= 8; i++) {
      const isUnlocked = i <= maxUnlockedLevel;
      const card = document.createElement("div");
      card.className = `level-card ${isUnlocked ? '' : 'locked'}`;
      card.innerHTML = `
        <div>Level ${i}</div>
        <div style="font-size: 0.8rem;">${isUnlocked ? '🔓 Terbuka' : '🔒 Terkunci'}</div>
      `;
      
      if (isUnlocked) {
        card.onclick = () => pilihLevel(i);
      }
      grid.appendChild(card);
    }
  }

  function pilihLevel(lvl) {
    currentLevel = lvl;
    currentMode = "mencoba";
    document.getElementById("levelMapScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    
    muatSoal(currentLevel, "mencoba");
  }

  function kembaliKePetaLevel() {
    hentikanMerekamManual();
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("levelMapScreen").style.display = "block";
    renderPetaLevel();
  }

  async function muatSoal(level, mode) {
    document.getElementById("wordDisplay").innerText = "Memuat...";
    document.getElementById("statusText").innerText = "";
    document.getElementById("detectedText").style.display = "none";
    document.getElementById("btnPlayUser").style.display = "none";
    document.getElementById("btnStop").style.display = "none";
    
    try {
      const response = await fetch(`${API_URL}?action=getSoal&level=${level}&mode=${mode}`, {
        method: "GET",
        redirect: "follow"
      });
      
      soalList = await response.json();
      
      if (!soalList || soalList.length === 0 || soalList.error) {
        document.getElementById("wordDisplay").innerText = "Kosong";
        tampilkanStatus(`Soal Level ${level} belum ada di Sheet BankSoal!`, false);
        return;
      }
      
      currentIndex = 0;
      tampilkanSoal();
    } catch (error) {
      document.getElementById("wordDisplay").innerText = "Gagal";
      tampilkanStatus("Gagal terhubung ke Google Sheets.", false);
    }
  }

  function tampilkanSoal() {
    if (soalList.length === 0) return;
    
    isEvaluated = false;
    const target = soalList[currentIndex];
    const displayBox = document.getElementById("wordDisplay");
    displayBox.innerText = target.teks;
    displayBox.className = "target-text";
    
    document.getElementById("levelBadge").innerText = `Level ${target.level}`;
    document.getElementById("btnPlayUser").style.display = "none";
    document.getElementById("btnStop").style.display = "none";
    document.getElementById("btnMic").style.display = "inline-block";
    
    // Level 1 & 2: Munculkan Tombol Lanjut Bebas
    if (currentLevel <= 2) {
      document.getElementById("btnSkip").style.display = "inline-block";
    } else {
      // Level 3 Ke Atas: Sembunyikan Tombol Lanjut (Wajib Validasi AI)
      document.getElementById("btnSkip").style.display = "none";
    }

    if (currentMode === "mencoba") {
      document.getElementById("btnAudio").style.display = "inline-block";
      document.getElementById("modeTitle").innerText = "Mode Mencoba (Latihan Bebas)";
    } else {
      document.getElementById("btnAudio").style.display = "none";
      document.getElementById("modeTitle").innerText = "Mode Ujian (Tes Ketuntasan 100%)";
    }
  }

  function putarAudioContoh() {
    const audioUrl = soalList[currentIndex].audioContoh;
    if (audioUrl && audioUrl.startsWith("http")) {
      const audio = new Audio(audioUrl);
      audio.play().catch(() => fallbackTextToSpeech());
    } else {
      fallbackTextToSpeech();
    }
  }

  function fallbackTextToSpeech() {
    const teksBersih = soalList[currentIndex].teks.replace(/-/g, "");
    const utterance = new SpeechSynthesisUtterance(teksBersih);
    utterance.lang = 'id-ID';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  }

  async function mulaiMerekam() {
    if (!recognition) return;
    
    isEvaluated = false;
    audioChunks = [];
    document.getElementById("detectedText").style.display = "none";
    document.getElementById("btnPlayUser").style.display = "none";
    document.getElementById("btnMic").style.display = "none";
    document.getElementById("btnStop").style.display = "inline-block";
    
    const displayBox = document.getElementById("wordDisplay");
    displayBox.classList.add("listening-anim");
    
    tampilkanStatus("🎙️ Mendengarkan... Sebutkan kata di atas!", true);

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        userAudioUrl = URL.createObjectURL(audioBlob);
        document.getElementById("btnPlayUser").style.display = "inline-block";
      };
      mediaRecorder.start();
      recognition.start();
    } catch (err) {
      document.getElementById("btnMic").style.display = "inline-block";
      document.getElementById("btnStop").style.display = "none";
      displayBox.classList.remove("listening-anim");
      tampilkanStatus("❌ Izinkan akses mikrofon di browser!", false);
    }
  }

  function hentikanMerekamManual() {
    document.getElementById("btnMic").style.display = "inline-block";
    document.getElementById("btnStop").style.display = "none";
    document.getElementById("wordDisplay").classList.remove("listening-anim");
    if (recognition) {
      try { recognition.stop(); } catch(e){}
    }
    stopAudioRecording();
  }

  function stopAudioRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
  }

  function putarRekamanUser() {
    if (userAudioUrl) {
      const audio = new Audio(userAudioUrl);
      audio.play();
    }
  }

  function lewatiSoalTanpaValidasi() {
    hentikanMerekamManual();
    currentIndex++;
    if (currentIndex < soalList.length) {
      tampilkanSoal();
      document.getElementById("statusText").innerText = "";
      document.getElementById("detectedText").style.display = "none";
    } else {
      selesaiSatuMode();
    }
  }

  function evaluasiJawabanOtomatis(jawabanSuara) {
    if (isEvaluated) return;

    const targetAwal = soalList[currentIndex].teks.toLowerCase().trim();
    const targetBersih = targetAwal.replace(/[^a-z0-9]/g, "");
    const jawabanBersih = jawabanSuara.toLowerCase().replace(/[^a-z0-9]/g, "");

    let isBenar = false;
    if (jawabanBersih === targetBersih || jawabanBersih.includes(targetBersih) || targetBersih.includes(jawabanBersih)) {
      isBenar = true;
    }

    if (isBenar) {
      isEvaluated = true;
      hentikanMerekamManual();

      const displayBox = document.getElementById("wordDisplay");
      displayBox.className = "target-text correct-anim";
      tampilkanStatus("✅ BETUL! PINTAR!", true);
      putarSuaraSistem("Betul!");

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < soalList.length) {
          tampilkanSoal();
          document.getElementById("statusText").innerText = "";
          document.getElementById("detectedText").style.display = "none";
        } else {
          selesaiSatuMode();
        }
      }, 1000);

    } else {
      tampilkanStatus(`❌ Terdengar "${jawabanSuara}". BELUM TEPAT, ULANGI!`, false);
      if (currentMode === "ujian") {
        isEvaluated = true;
        hentikanMerekamManual();
        putarSuaraSistem("Belum tepat, ujian diulang dari nomor satu!");
        alert("Pembacaan belum tepat! Ujian diulang dari nomor 1.");
        muatSoal(currentLevel, "ujian");
      }
    }
  }

  function selesaiSatuMode() {
    if (currentMode === "mencoba") {
      putarSuaraSistem("Luar biasa! Mode Ujian terbuka!");
      tampilkanStatus("🎉 Latihan Selesai! Klik Mode Ujian di bawah.", true);
    } else {
      simpanHasilKeSpreadsheet(currentLevel);

      if (currentLevel === maxUnlockedLevel && maxUnlockedLevel < 8) {
        maxUnlockedLevel++;
      }

      putarSuaraSistem("Selamat, kamu tuntas!");
      alert(`SELAMAT ${namaSiswa}! Kamu TUNTAS Ujian Level ${currentLevel}! Level berikutnya telah terbuka.`);
      kembaliKePetaLevel();
    }
  }

  async function simpanHasilKeSpreadsheet(level) {
    try {
      await fetch(`${API_URL}?action=saveResult&nama=${encodeURIComponent(namaSiswa)}&level=${level}&status=Tuntas`, {
        method: "GET",
        redirect: "follow"
      });
    } catch (e) {
      console.log("Gagal menyimpan hasil:", e);
    }
  }

  function pindahKeUjian() {
    currentMode = "ujian";
    muatSoal(currentLevel, "ujian");
  }

  function tampilkanStatus(pesan, isSuccess) {
    const el = document.getElementById("statusText");
    el.innerText = pesan;
    el.className = "status-text " + (isSuccess ? "success" : "error");
  }

  function putarSuaraSistem(teks) {
    const utterance = new SpeechSynthesisUtterance(teks);
    utterance.lang = 'id-ID';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
</script>

</body>
</html>
